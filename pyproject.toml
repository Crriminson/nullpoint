[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nullpoint"
version = "0.1.0"
description = "Eye-communication board that measures nystagmus and adapts to it"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["nullpoint*"]

[tool.setuptools.package-data]
"nullpoint.board" = ["static/*"]
